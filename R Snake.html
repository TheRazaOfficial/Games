<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--page:#e8edf3;--ink:#44505c;--accent:#2f6fdb;--b1:#5a97ff;--b2:#2f6fdb;--bs:#1b469c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#12161a;--ink:#9aa7b3;--accent:#6aa0ff}}
:root[data-theme="dark"]{--page:#12161a;--ink:#9aa7b3;--accent:#6aa0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px 10px 20px;-webkit-user-select:none;user-select:none}
.wrap{width:min(100%,460px);zoom:var(--k,1)}
.brand{text-align:center;font:52px/1 "Permanent Marker","Marker Felt",cursive;color:var(--accent);margin:0 0 8px;transform:rotate(-4deg)}
.lcd{background:#a3b87c;border-radius:10px;padding:9px 10px 10px;box-shadow:inset 0 0 16px rgba(20,30,10,.45),0 6px 18px rgba(0,0,0,.25);font-family:"Courier New",Courier,monospace;color:#1f2a14}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:0 2px 6px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid #1f2a14;touch-action:none}
.keys{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding:0 6px}
.act{display:flex;flex-direction:column;gap:14px}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-auto-rows:58px;gap:6px}
button{border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:linear-gradient(var(--b1),var(--b2));box-shadow:0 4px 0 var(--bs),0 6px 10px rgba(0,0,0,.28)}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--bs)}
button:focus-visible{outline:3px solid #f2c94c;outline-offset:3px}
.dpad button{border-radius:50%}
.dpad svg{width:26px;height:26px;display:block}
.act button{width:112px;height:48px;border-radius:24px;font:700 15px Arial,sans-serif;letter-spacing:.12em}
.hint{margin:22px 0 0;font-size:12px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">R</div>
  <div class="lcd">
    <div class="hud"><span id="sc">SCORE 000</span><span id="hi">HI 000</span></div>
    <canvas id="c" width="336" height="192"></canvas>
  </div>
  <div class="keys">
    <div class="act">
      <button id="start" aria-label="Start">START</button>
      <button id="pause" aria-label="Pause">PAUSE</button>
    </div>
    <div class="dpad">
      <span></span>
      <button data-d="0,-1" aria-label="Up"><svg viewBox="0 0 24 24" style="transform:rotate(0deg)"><path d="M12 4L21 16H3Z" fill="currentColor"/></svg></button>
      <span></span>
      <button data-d="-1,0" aria-label="Left"><svg viewBox="0 0 24 24" style="transform:rotate(-90deg)"><path d="M12 4L21 16H3Z" fill="currentColor"/></svg></button>
      <span></span>
      <button data-d="1,0" aria-label="Right"><svg viewBox="0 0 24 24" style="transform:rotate(90deg)"><path d="M12 4L21 16H3Z" fill="currentColor"/></svg></button>
      <span></span>
      <button data-d="0,1" aria-label="Down"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M12 4L21 16H3Z" fill="currentColor"/></svg></button>
      <span></span>
    </div>
  </div>
  <p class="hint">Arrow keys or WASD to steer. Enter = start, Space = pause. Walls and your own tail end the game.</p>
</div>
<script>
(function(){
  var C=21,R=12,S=16,INK="#1f2a14",BG="#a3b87c";
  var cv=document.getElementById("c"),g=cv.getContext("2d");
  var scEl=document.getElementById("sc"),hiEl=document.getElementById("hi");
  var hi=0;try{hi=+localStorage.getItem("snake-hi")||0}catch(e){}
  var snake=[],dir,queue=[],food,score=0,delay=240,state="title",timer=null,blink=true,ac;

  function pad(n){return String(n).padStart(3,"0")}
  function hud(){scEl.textContent="SCORE "+pad(score);hiEl.textContent="HI "+pad(Math.max(hi,score))}
  function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),v=ac.createGain();o.type="square";o.frequency.value=f;v.gain.value=.04;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

  function placeFood(){
    var p;do{p={x:Math.floor(Math.random()*C),y:Math.floor(Math.random()*R)}}while(snake.some(function(s){return s.x===p.x&&s.y===p.y}));
    food=p;
  }
  function reset(){snake=[{x:6,y:6},{x:5,y:6},{x:4,y:6}];dir={x:1,y:0};queue=[];score=0;delay=240;placeFood();hud()}
  function schedule(){clearTimeout(timer);timer=setTimeout(step,delay)}
  function start(){reset();state="play";draw();schedule()}
  function die(){
    state="over";clearTimeout(timer);beep(120,.35);
    if(score>hi){hi=score;try{localStorage.setItem("snake-hi",hi)}catch(e){}}
    hud();draw();
  }
  function step(){
    if(state!=="play")return;
    if(queue.length)dir=queue.shift();
    var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    var grow=h.x===food.x&&h.y===food.y,body=grow?snake:snake.slice(0,-1);
    if(h.x<0||h.y<0||h.x>=C||h.y>=R||body.some(function(s){return s.x===h.x&&s.y===h.y}))return die();
    snake.unshift(h);
    if(grow){score+=7;beep(880,.06);delay=Math.max(70,delay-4);placeFood();hud()}else snake.pop();
    draw();schedule();
  }
  function turn(dx,dy){
    if(state!=="play")return;
    var l=queue.length?queue[queue.length-1]:dir;
    if((dx===l.x&&dy===l.y)||(dx===-l.x&&dy===-l.y))return;
    if(queue.length<2)queue.push({x:dx,y:dy});
  }
  function pauseBtn(){
    if(state==="play"){state="pause";clearTimeout(timer);draw()}
    else if(state==="pause"){state="play";draw();schedule()}
  }
  function startBtn(){
    if(state==="title"||state==="over")start();
    else if(state==="pause")pauseBtn();
  }

  function box(lines){
    var w=232,h=lines.length*26+22,x=(cv.width-w)/2,y=(cv.height-h)/2;
    g.fillStyle=BG;g.fillRect(x,y,w,h);g.strokeStyle=INK;g.lineWidth=4;g.strokeRect(x+2,y+2,w-4,h-4);
    g.fillStyle=INK;g.textAlign="center";g.textBaseline="middle";
    lines.forEach(function(l,i){g.font="bold "+l[1]+"px 'Courier New',monospace";g.fillText(l[0],cv.width/2,y+22+i*26+(l[1]>20?4:0))});
  }
  function draw(){
    g.fillStyle=BG;g.fillRect(0,0,cv.width,cv.height);
    if(state==="title"){box([["SNAKE",34],["PRESS START",14]]);return}
    g.fillStyle=INK;
    snake.forEach(function(s,i){var p=i===0?1:2;g.fillRect(s.x*S+p,s.y*S+p,S-p*2,S-p*2)});
    if(food&&(blink||state!=="play")){var cx=food.x*S+S/2,cy=food.y*S+S/2;g.fillRect(cx-2,cy-6,4,12);g.fillRect(cx-6,cy-2,12,4)}
    if(state==="over")box([["GAME OVER",22],["SCORE "+score,14],["PRESS START",14]]);
    if(state==="pause")box([["PAUSED",22],["PRESS START",14]]);
  }
  setInterval(function(){blink=!blink;if(state==="play"||state==="title")draw()},280);
  document.addEventListener("visibilitychange",function(){if(document.hidden&&state==="play")pauseBtn()});

  var km={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
  window.addEventListener("keydown",function(e){
    var k=e.key;
    if(km[k]){e.preventDefault();turn(km[k][0],km[k][1])}
    else if(k==="Enter"){e.preventDefault();startBtn()}
    else if(k===" "||k==="p"||k==="P"){e.preventDefault();pauseBtn()}
  });
  document.querySelectorAll("[data-d]").forEach(function(b){
    b.addEventListener("pointerdown",function(e){e.preventDefault();var d=b.dataset.d.split(",");turn(+d[0],+d[1])});
  });
  document.getElementById("start").addEventListener("pointerdown",function(e){e.preventDefault();startBtn()});
  document.getElementById("pause").addEventListener("pointerdown",function(e){e.preventDefault();pauseBtn()});

  var sx=0,sy=0;
  cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY});
  cv.addEventListener("pointerup",function(e){
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)<18&&Math.abs(dy)<18){startBtn();return}
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  });
  function fit(){
    var r=document.documentElement,wrap=document.querySelector(".wrap");
    r.style.setProperty("--k","1");
    var k=Math.max(1,Math.min((r.clientWidth-20)/460,(window.innerHeight-34)/wrap.offsetHeight,2.4));
    r.style.setProperty("--k",k.toFixed(3));
  }
  window.addEventListener("resize",fit);window.addEventListener("load",fit);fit();
  reset();state="title";draw();
})();
</script>
</body>
</html>
